name: Publish preview
on:
  push:
    branches: [main]
    paths: [custom_components/dashboard_robot/manifest.json, CHANGELOG.md, scripts/release_notes.py, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package integration and publish preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python -c 'import json; print(json.load(open("custom_components/dashboard_robot/manifest.json"))["version"])')
          tag="v${version}"
          python scripts/release_notes.py "$version" > release-notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file release-notes.md
            exit 0
          fi
          cd custom_components/dashboard_robot
          zip -r ../../dashboard_robot.zip . -x '*/__pycache__/*' '*.pyc'
          cd ../..
          gh release create "$tag" dashboard_robot.zip --target "$GITHUB_SHA" --prerelease --title "Dashboard Robot $tag" --notes-file release-notes.md
